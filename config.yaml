# jobhunt configuration. Everything tunable lives here — no editing Python.
#
# Tune `filters` first. It is deterministic, free, and it is what keeps the
# LLM bill small: roughly 2000 raw postings -> 40 candidates before a single
# token is spent.

filters:
  # Title regexes, matched case-insensitively against the job title only.
  # A title must match at least one include AND zero excludes.
  #
  # Gotcha: "sde" as a bare regex does NOT match "Software Development
  # Engineer" — different words entirely. Use \bsde\b for the acronym and
  # list the spelled-out variants separately, as below.
# ==========================================
# Job Search Criteria & Filtering Config
# ==========================================

# Target job titles aligned with your AI, ML, Data Science, and Python stack
include_titles:
  - "AI Engineer"
  - "Machine Learning Engineer"
  - "ML Engineer"
  - "Generative AI Engineer"
  - "LLM Engineer"
  - "Applied AI Engineer"
  - "Applied Scientist"
  - "Data Scientist"
  - "Python Developer"
  - "Python Engineer"
  - "MLOps Engineer"
  - "AI Platform Engineer"
  - "Deep Learning Engineer"
  - "NLP Engineer"
  - "Computer Vision Engineer"
  - "Member of Technical Staff - AI"

# Titles to strictly exclude
exclude_titles:
  - "Frontend"
  - "UI/UX"
  - "Mobile Developer"
  - "iOS"
  - "Android"
  - "React Developer"
  - "Full Stack"
  - "Java Developer"
  - "C# Developer"
  - "PHP Developer"
  - ".NET Developer"
  - "Director"
  - "Vice President"
  - "VP"
  - "Engineering Manager"
  - "Manager"
  - "Product Manager"
  - "Sales Engineer"

# Target locations
locations:
  - "Bengaluru"
  - "Bangalore"
  - "Remote"

# Include remote positions regardless of base office location
allow_remote: true

# Maximum age of the posting in days
max_age_days: 30

# Matching sensitivity (Score 1 - 10)
# 7 matches your core skills (FastAPI, LangChain, LlamaIndex, Vector DBs, PyTorch) without filtering out edge AI/ML roles

# --- LLM stages -------------------------------------------------------------
screen_batch_size: 8      # jobs per screening call. Higher = cheaper, sloppier.
screen_jd_chars: 1400     # JD truncation for screening
draft_jd_chars: 6000      # JD truncation for drafting
score_threshold: 7.0      # below this, no draft and no digest slot
max_per_digest: 5         # hard cap on expensive draft calls per run

# --- paths ------------------------------------------------------------------
companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv
